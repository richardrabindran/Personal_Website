<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f0f4ff, #dfe9ff);
        color: #1f2937;
      }

      .card {
        background: white;
        padding: 3rem 4rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 3rem;
      }

      p {
        margin-top: 0.75rem;
        font-size: 1.1rem;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello, World!</h1>
      <p>Your simple website is ready.</p>
    </div>
  </body>
</html>

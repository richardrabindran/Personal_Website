<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richard Rabindran - Website</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        text-align: center;
        width: 100%;
        max-width: 700px;
        padding: 2rem 1.5rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2.5rem;
      }

      p {
        margin: 0.5rem 0;
        font-size: 1rem;
      }

      .photos {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .photo {
        width: min(100%, 420px);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      figcaption {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        color: #333333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Divine Rapha Richard Rabindran</h1>
      <p>Welcome to my personal website.</p>
      <p>personal email: richardrabindran@gmail.com</p>
      <p>linkedin: <a href="https://www.linkedin.com/in/divinerapharabindran/" target="_blank">Richard Rabindran</a></p>
      <p>github: <a href="https://github.com/richardrabindran" target="_blank">Richard Rabindran</a></p>
      <p>twitter: <a href="https://twitter.com/divinerapha" target="_blank">@divinerapha</a></p>

      <div class="photos">
        <figure class="photo">
          <img src="godawgs.jpeg" alt="Go Dawgs" />
          <figcaption>Go Dawgs!</figcaption>
        </figure>

        <figure class="photo">
          <img src="richard.jpg" alt="Richard Rabindran headshot" />
          <figcaption>Professional Headshot</figcaption>
        </figure>

        <figure class="photo">
          <img src="richard_cyberarch.jpg" alt="Richard Rabindran portrait" />
          <figcaption>CyberArch</figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
